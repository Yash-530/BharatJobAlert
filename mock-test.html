<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mock Tests &amp; Previous Year Questions | BharatJobAlert</title>
    <meta name="description" content="Practice free SSC CGL, RRB NTPC, IBPS Banking, and UPSC Previous Year Questions with instant solutions and timer.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">BharatJobAlert</div>
                <nav class="top-nav" aria-label="Main navigation">
                    <a href="index.html">Home</a>
                    <a href="syllabus.html">Syllabus</a>
                    <a href="mock-test.html" class="active">Mock Tests &amp; PYQs</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a href="privacy-policy.html">Privacy Policy</a>
                    <a href="disclaimer.html">Disclaimer</a>
                </nav>
            </div>
        </header>

        <div class="filters">
            <div class="filter-section">
                <label class="filter-label">Select Exam for Practice &amp; Previous Year Questions</label>
                <div class="filter-chips" id="examFilters">
                    <button class="chip active" data-exam="all">All Exams</button>
                    <button class="chip" data-exam="SSC">SSC CGL</button>
                    <button class="chip" data-exam="RRB">Railway (RRB)</button>
                    <button class="chip" data-exam="BANKING">Banking</button>
                    <button class="chip" data-exam="UPSC">UPSC</button>
                </div>
            </div>
        </div>

        <div class="ad-slot" aria-label="Advertisement slot">
            Responsive Display Ad Slot (Above Mock Test Area)
        </div>

        <main class="detail-container">
            <div class="quiz-header">
                <div>
                    <h1 style="font-size:22px; color:#212121;">Practice Mock Test &amp; PYQs</h1>
                    <p id="scoreText" style="font-size:14px; color:#616161; margin-top:4px;">Score: 0 / 0</p>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <span class="timer-pill" id="timerDisplay">Time: 00:00</span>
                    <button type="button" class="quick-view-btn" id="resetQuizBtn">Restart</button>
                </div>
            </div>

            <div id="quizContainer"></div>
        </main>

        <footer class="site-footer">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="syllabus.html">Syllabus</a>
                <a href="about.html">About Us</a>
                <a href="privacy-policy.html">Privacy Policy</a>
            </div>
            <p>BharatJobAlert — Free Practice &amp; Previous Year Question Bank</p>
        </footer>
    </div>

    <script src="questions-data.js"></script>
    <script>
        const allQuestions = window.QUESTIONS_DATA || [];
        const urlExam = new URLSearchParams(window.location.search).get('exam');
        let activeExam = urlExam || 'all';
        let score = 0;
        let answeredCount = 0;
        let seconds = 0;
        let timerHandle = null;

        function startTimer() {
            clearInterval(timerHandle);
            seconds = 0;
            timerHandle = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `Time: ${m}:${s}`;
            }, 1000);
        }

        function renderQuiz() {
            const list = allQuestions.filter(q => activeExam === 'all' || q.exam === activeExam);
            score = 0;
            answeredCount = 0;
            document.getElementById('scoreText').textContent = `Score: 0 / ${list.length}`;
            const container = document.getElementById('quizContainer');

            if (list.length === 0) {
                container.innerHTML = '<p>No questions found for this exam yet.</p>';
                return;
            }

            container.innerHTML = list.map((q, qIdx) => `
                <div class="question-box" data-qidx="${qIdx}">
                    <div style="font-size:12px; color:#1976d2; font-weight:700; margin-bottom:6px;">
                        ${q.exam} &bull; ${q.subject} &bull; ${q.year}
                    </div>
                    <h3 style="font-size:16px; color:#212121; margin-bottom:8px;">Q${qIdx + 1}. ${q.question}</h3>
                    ${q.options.map((opt, oIdx) => `
                        <button type="button" class="option-btn" data-qidx="${qIdx}" data-oidx="${oIdx}">${opt}</button>
                    `).join('')}
                    <div class="explanation-box" id="exp-${qIdx}">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                </div>
            `).join('');

            startTimer();
        }

        document.getElementById('quizContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn || btn.disabled) return;
            const list = allQuestions.filter(q => activeExam === 'all' || q.exam === activeExam);
            const qIdx = Number(btn.dataset.qidx);
            const oIdx = Number(btn.dataset.oidx);
            const q = list[qIdx];
            const box = btn.closest('.question-box');
            const buttons = box.querySelectorAll('.option-btn');

            buttons.forEach((b, idx) => {
                b.disabled = true;
                if (idx === q.answerIndex) b.classList.add('correct');
            });

            if (oIdx === q.answerIndex) {
                score++;
            } else {
                btn.classList.add('wrong');
            }
            answeredCount++;
            document.getElementById(`exp-${qIdx}`).classList.add('show');
            document.getElementById('scoreText').textContent = `Score: ${score} / ${list.length} (${answeredCount} answered)`;
        });

        document.getElementById('examFilters').addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                document.querySelectorAll('#examFilters .chip').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeExam = e.target.dataset.exam;
                renderQuiz();
            }
        });

        document.getElementById('resetQuizBtn').addEventListener('click', renderQuiz);

        // Sync initial chip if ?exam= was passed
        if (urlExam) {
            document.querySelectorAll('#examFilters .chip').forEach(b => {
                b.classList.toggle('active', b.dataset.exam === urlExam);
            });
        }
        renderQuiz();
    </script>
</body>
</html>
