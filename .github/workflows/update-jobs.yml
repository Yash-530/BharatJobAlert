name: Auto-Update Job Listings
on: { workflow_dispatch: {}, schedule: [{ cron: '0 */12 * * *' }] }
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 Scripts/update_jobs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs-data.js sitemap.xml
          git diff --staged --quiet || (git commit -m "Auto-update job listings" && git push)
